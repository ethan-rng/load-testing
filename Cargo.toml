[package]
name = "hw-load"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bcrypt = "0.19.3"
clap = { version = "4.6.7", features = ["derive"] }
humantime = "2.4.0"
rand = "0.10.3"
rand_regex = "0.19.0"
reqwest = { version = "0.13.5", features = ["json", "cookies", "form", "query"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
jsonschema = "0.60.2"
